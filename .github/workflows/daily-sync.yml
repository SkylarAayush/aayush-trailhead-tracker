name: Daily Trailhead Sync

on:
  schedule:
    # Runs automatically every single day at 00:00 UTC (5:30 AM IST)
    - cron: '0 0 * * *'
  workflow_dispatch: # Allows manual 1-click execution anytime

jobs:
  sync-trailhead:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install

      - name: Run Puppeteer Sync
        env:
          WEB_APP_URL: ${{ secrets.WEB_APP_URL }}
        run: node sync.js
